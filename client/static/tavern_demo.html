<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🃏 股票大亨 · 地下交易酒馆</title>
<style>
/* ============ 骗子酒馆 视觉令牌 ============ */
:root{
  --bg:#1a130d; --wood:#2b1f14; --leather:#3a2a1c; --felt:#1e3a2f;
  --candle:#e8b563; --brass:#c9a86a; --text:#e8dcc8; --dim:#8a7a64;
  --up:#d9534f; --down:#5cb85c; --rare-gold:#ffcf6b; --rare-purple:#b06bd6;
  --fac-def:#5b8db8; --fac-agg:#c0392b; --fac-inf:#8e44ad;
  --fac-trd:#27ae60; --fac-evt:#e67e22; --fac-qnt:#95a5a6;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Microsoft YaHei','PingFang SC',sans-serif;
  color:var(--text); background:var(--bg); overflow:hidden;
  background:
    radial-gradient(ellipse 60% 50% at 50% 38%, rgba(232,181,99,.16), transparent 70%),
    radial-gradient(ellipse 120% 90% at 50% 50%, transparent 40%, rgba(0,0,0,.7) 100%),
    repeating-linear-gradient(90deg,#241a10,#241a10 3px,#2b1f14 3px,#2b1f14 6px);
}
.pixel{image-rendering:pixelated}
button{font-family:inherit;cursor:pointer;color:var(--text)}
.brass-border{border:1px solid var(--brass)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--leather);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* 烛光呼吸 */
@keyframes flicker{0%,100%{opacity:.95}45%{opacity:.82}70%{opacity:1}}
.candle-overlay{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 50% 40% at 50% 35%, rgba(232,181,99,.10), transparent 65%);
  animation:flicker 5s ease-in-out infinite}

/* ============ 通用按钮 ============ */
.btn{padding:10px 22px;border:1px solid var(--brass);border-radius:7px;
  background:linear-gradient(180deg,#3a2a1c,#2b1f14);color:var(--text);
  font-size:.95rem;transition:.18s;letter-spacing:1px}
.btn:hover{background:linear-gradient(180deg,#4a3725,#3a2a1c);box-shadow:0 0 14px rgba(232,181,99,.3)}
.btn-primary{background:linear-gradient(180deg,#e8b563,#c9912f);color:#241a10;font-weight:bold;border-color:#f0c97a}
.btn-primary:hover{box-shadow:0 0 20px rgba(232,181,99,.5)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-buy{border-color:var(--up);color:#f2b8b3}
.btn-sell{border-color:var(--down);color:#bfe6bf}

/* ============ 准备界面 ============ */
#prep{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:24px}
#prep h1{font-size:2.6rem;color:var(--candle);text-shadow:0 2px 12px rgba(232,181,99,.4);letter-spacing:4px}
#prep .sub{color:var(--dim);letter-spacing:2px;margin-top:-10px}
.prep-panel{background:rgba(43,31,20,.85);border:1px solid var(--brass);border-radius:14px;padding:26px 32px;max-width:760px;width:100%;backdrop-filter:blur(2px)}
.prep-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;font-size:1.05rem}
.bank-num{color:var(--candle);font-weight:bold;font-size:1.3rem;font-variant-numeric:tabular-nums}
.bring-val{color:var(--rare-gold);font-weight:bold;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;margin:0 16px;accent-color:var(--candle)}
.fac-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.fac-card{border:1px solid var(--leather);border-radius:10px;padding:14px 10px;text-align:center;background:rgba(26,19,13,.6);transition:.18s}
.fac-card:hover{transform:translateY(-3px);border-color:var(--brass)}
.fac-card.sel{border-color:var(--candle);box-shadow:0 0 16px rgba(232,181,99,.4);background:rgba(58,42,28,.8)}
.fac-card .ic{font-size:2rem}
.fac-card .nm{font-weight:bold;margin:6px 0 2px}
.fac-card .ds{font-size:.74rem;color:var(--dim);line-height:1.35}

/* ============ 游戏主界面 ============ */
#game{position:fixed;inset:0;z-index:2;display:none;grid-template-rows:48px 1fr 152px;grid-template-columns:228px 1fr 312px;
  grid-template-areas:"hud hud hud" "ai center cards" "hud2 hand hand"}
#game.on{display:grid}

/* HUD */
.hud{grid-area:hud;display:flex;align-items:center;gap:18px;padding:0 18px;
  background:linear-gradient(180deg,#3a2a1c,#241a10);border-bottom:1px solid var(--brass);font-size:.9rem}
.hud .logo{color:var(--candle);font-weight:bold;letter-spacing:2px}
.hud .seg{color:var(--dim)}
.hud .seg b{color:var(--text)}
.hud .cash{color:var(--candle);font-variant-numeric:tabular-nums}
.ap-dots{display:inline-flex;gap:4px;vertical-align:middle}
.ap-dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--brass);background:transparent}
.ap-dot.on{background:var(--candle);box-shadow:0 0 6px var(--candle)}
.hud .spacer{flex:1}
.phase-pill{padding:3px 12px;border:1px solid var(--brass);border-radius:20px;color:var(--candle);font-size:.82rem}

/* 左：AI 剧场 */
.ai-stage{grid-area:ai;position:relative;border-right:1px solid var(--leather);padding:8px 0;overflow:visible}
.ai-row{display:flex;align-items:center;height:calc((100% - 0px)/6);padding-left:10px}
.ai-sprite{position:relative;width:64px;height:64px;flex:0 0 auto;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:2rem;
  border:2px solid var(--leather);background:radial-gradient(circle at 50% 35%,#3a2a1c,#241a10);
  transition:.2s;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.ai-sprite .name{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);
  font-size:.62rem;color:var(--dim);white-space:nowrap;font-family:monospace}
.ai-sprite .pnl{position:absolute;top:-12px;right:-8px;font-size:.6rem;font-variant-numeric:tabular-nums}
.ai-sprite.speaking{border-color:var(--candle);box-shadow:0 0 16px rgba(232,181,99,.55);transform:translateX(3px) scale(1.05);animation:none}
.ai-sprite.selectable{cursor:pointer;border-color:var(--rare-gold);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 4px var(--rare-gold)}50%{box-shadow:0 0 18px var(--rare-gold)}}
.ai-sprite.dim{filter:grayscale(.6) opacity(.45);animation:none}
.ai-sprite.investigated::after{content:'✔';position:absolute;top:-6px;left:-6px;font-size:.7rem;
  background:var(--down);color:#13230f;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
/* 发言泳道：贴近 AI 头像 */
.bubble{position:absolute;left:82px;width:288px;z-index:6;
  background:rgba(30,22,16,.97);border:1px solid var(--brass);border-radius:9px;padding:10px 13px;
  font-size:.82rem;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:top .3s}
.bubble::before{content:'';position:absolute;left:-9px;top:22px;border:5px solid transparent;border-right-color:var(--brass)}
.bubble b{color:var(--candle)}
.bubble .rv{font-size:.66rem;color:var(--dim);display:block;margin-top:4px}

/* 中：主区 */
.center{grid-area:center;overflow-y:auto;padding:14px 18px}
.news-card{background:linear-gradient(180deg,#332518,#241a10);border:1px solid var(--brass);border-left:4px solid var(--candle);
  border-radius:9px;padding:14px 16px;margin-bottom:14px;position:relative}
.news-card .tag{font-size:.7rem;color:var(--dim);letter-spacing:2px}
.news-card .hint{font-size:.76rem;color:var(--dim);font-style:italic;margin-top:8px}
.news-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(201,168,106,.18);font-size:1rem;line-height:1.5}
.news-item:last-of-type{border-bottom:none}
.news-item .bull{color:var(--candle);flex:0 0 auto}
.news-item .txt{flex:1}
.news-item .real{flex:0 0 auto;font-size:.68rem;padding:1px 7px;border-radius:10px;align-self:center}
.news-item .real.t{background:rgba(92,184,92,.18);color:var(--down);border:1px solid var(--down)}
.news-item .real.f{background:rgba(217,83,79,.18);color:var(--up);border:1px solid var(--up)}
.news-quiet{color:var(--dim);font-style:italic;padding:10px 2px}
.section-t{font-size:.78rem;color:var(--dim);letter-spacing:3px;margin:6px 0 8px}
.stock-tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.stock-tbl th{text-align:left;color:var(--dim);font-weight:normal;font-size:.74rem;padding:4px 8px;border-bottom:1px solid var(--leather)}
.stock-tbl td{padding:7px 8px;border-bottom:1px solid rgba(58,42,28,.5);font-variant-numeric:tabular-nums}
.stock-tbl tr{cursor:pointer;transition:.12s}
.stock-tbl tr:hover td{background:rgba(58,42,28,.4)}
.stock-tbl tr.sel td{background:rgba(232,181,99,.1)}
.code{font-family:monospace;color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)}
/* 迷你 K 线（蜡烛图，稳定不随点击变化） */
.kline{display:inline-flex;align-items:flex-start;gap:2px;height:24px;position:relative}
.cdl{position:relative;width:5px;height:24px}
.cdl .wk{position:absolute;left:2px;width:1px;background:currentColor}
.cdl .bd{position:absolute;left:0;width:5px;border-radius:1px;background:currentColor}
.cdl.u{color:var(--up)} .cdl.d{color:var(--down)}
/* AI 调查结果（持续显示） */
.ai-rev{margin-left:9px;font-size:.6rem;color:var(--rare-gold);line-height:1.35;max-width:138px;font-family:monospace}
.ai-rev .k{color:var(--dim)}
.pos-tag{font-size:.7rem;color:var(--candle)}

/* 右：候选卡 */
.cards-zone{grid-area:cards;border-left:1px solid var(--leather);padding:14px 12px;overflow-y:auto;
  background:linear-gradient(180deg,rgba(30,58,47,.18),transparent)}
.cards-zone h3{font-size:.82rem;color:var(--dim);letter-spacing:2px;text-align:center;margin-bottom:12px}
.cand-list{display:flex;flex-direction:column;gap:11px;align-items:center}
.card{width:150px;border-radius:11px;padding:11px;position:relative;transition:.18s;
  background:linear-gradient(165deg,#3a2a1c,#241a10);border:1px solid var(--leather)}
.card:hover{transform:translateY(-4px) rotateZ(-.6deg);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.card.picked{border-color:var(--candle);box-shadow:0 0 14px rgba(232,181,99,.4)}
.card .top{display:flex;justify-content:space-between;font-size:.78rem}
.card .ic{font-size:1.7rem;text-align:center;margin:6px 0}
.card .nm{font-weight:bold;text-align:center;font-size:.92rem}
.card .ds{font-size:.72rem;color:var(--dim);text-align:center;line-height:1.4;margin-top:4px;min-height:30px}
.card .ap{color:var(--candle);font-size:.72rem}
.card .star{color:var(--rare-gold);font-size:.72rem}
.card.fac-mark{border-top:3px solid var(--brass)}
.cand-cta{text-align:center;margin-top:14px}
.cand-note{text-align:center;color:var(--dim);font-size:.8rem;padding:30px 10px;line-height:1.6}

/* 底：手牌坞 */
.hand-l{grid-area:hud2;background:linear-gradient(180deg,#241a10,#1a130d);border-top:1px solid var(--brass);border-right:1px solid var(--leather);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:.72rem;color:var(--dim)}
.hand-dock{grid-area:hand;background:linear-gradient(180deg,#241a10,#1a130d);border-top:1px solid var(--brass);
  display:flex;align-items:center;gap:12px;padding:0 18px;overflow-x:auto}
.hcard{flex:0 0 auto;width:104px;height:124px;border-radius:9px;padding:8px;position:relative;transition:.16s;
  background:linear-gradient(165deg,#3a2a1c,#241a10);border:1px solid var(--leather);cursor:pointer}
.hcard:hover{transform:translateY(-6px);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.hcard.basic-buy{border-color:var(--up)}
.hcard.basic-sell{border-color:var(--down)}
.hcard.used{filter:grayscale(.8) opacity(.4);cursor:not-allowed}
.hcard.disabled{filter:grayscale(.6) opacity(.45);cursor:not-allowed}
.hcard .ic{font-size:1.5rem;text-align:center;margin-top:6px}
.hcard .nm{font-size:.8rem;text-align:center;font-weight:bold;margin-top:4px}
.hcard .ap{position:absolute;top:5px;right:7px;font-size:.68rem;color:var(--candle)}
.hcard .ty{position:absolute;top:5px;left:7px;font-size:.62rem;color:var(--dim)}
.hand-empty{color:var(--dim);font-size:.84rem}

/* ============ 模态 ============ */
.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(10,7,4,.78);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:linear-gradient(180deg,#332518,#241a10);border:1px solid var(--brass);border-radius:14px;
  padding:24px 28px;max-width:520px;width:92%;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.modal h2{color:var(--candle);font-size:1.3rem;margin-bottom:6px;letter-spacing:1px}
.modal .field{margin:14px 0}
.modal label{display:block;font-size:.82rem;color:var(--dim);margin-bottom:5px}
.modal input[type=number]{width:100%;padding:9px 12px;background:#1a130d;border:1px solid var(--leather);border-radius:7px;color:var(--text);font-size:1rem}
.modal input:focus{outline:none;border-color:var(--candle)}
.quick{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.quick button{padding:4px 10px;font-size:.76rem;border:1px solid var(--leather);border-radius:6px;background:#1a130d}
.quick button:hover{border-color:var(--candle)}
.fill-bar{height:10px;background:#1a130d;border-radius:5px;overflow:hidden;border:1px solid var(--leather);margin-top:6px}
.fill-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--down),var(--candle));transition:.3s}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.evt-opt{border:1px solid var(--leather);border-radius:9px;padding:12px 14px;margin:8px 0;cursor:pointer;transition:.15s}
.evt-opt:hover{border-color:var(--candle);background:rgba(58,42,28,.5)}
.evt-opt .ot{font-weight:bold;color:var(--text)}
.evt-opt .od{font-size:.78rem;color:var(--dim);margin-top:3px}
.settle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(58,42,28,.5);font-variant-numeric:tabular-nums}
.rank-badge{font-size:1.4rem;color:var(--candle);text-align:center;margin:10px 0}
.toast{position:fixed;top:60px;right:18px;z-index:40;background:rgba(30,22,16,.97);border:1px solid var(--brass);
  border-left:4px solid var(--candle);border-radius:8px;padding:12px 16px;font-size:.86rem;max-width:300px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translateX(120%);transition:.4s}
.toast.on{transform:translateX(0)}
</style>
</head>
<body>
<div class="candle-overlay"></div>

<!-- ========== 局外准备界面 ========== -->
<div id="prep">
  <h1>🃏 股票大亨</h1>
  <p class="sub">地下交易酒馆 · 第 1 局</p>
  <div class="prep-panel">
    <div class="prep-row"><span>🏦 银行总资产</span><span class="bank-num" id="bankNum">¥100,000</span></div>
    <div class="prep-row">
      <span>💼 本局带入</span>
      <input type="range" id="bringSlider" min="50000" max="100000" step="5000" value="80000">
      <span class="bring-val" id="bringVal">¥80,000</span>
    </div>
    <div class="section-t" style="margin-top:18px">选择本局流派（卡池将向该流派倾斜）</div>
    <div class="fac-grid" id="facGrid"></div>
    <div style="text-align:center;margin-top:22px">
      <button class="btn btn-primary" id="startBtn" disabled>进入酒馆 · 开始本局 ▸</button>
    </div>
  </div>
</div>

<!-- ========== 游戏主界面 ========== -->
<div id="game">
  <div class="hud">
    <span class="logo">🃏 地下交易酒馆</span>
    <span class="seg">第 <b id="hudDay">1</b>/7 日</span>
    <span class="phase-pill" id="hudPhase">盘前</span>
    <span class="seg">💰 <span class="cash" id="hudCash">¥80,000</span></span>
    <span class="seg">🎫 <span class="ap-dots" id="hudAp"></span></span>
    <span class="seg" id="hudCurios"></span>
    <span class="spacer"></span>
    <button class="btn" id="shopBtn" style="padding:5px 14px;font-size:.82rem">🛒 奇物商店</button>
    <span class="seg">流派 <b id="hudFac">—</b></span>
    <span class="seg">本局排名 <b id="hudRank">—</b>/7</span>
  </div>

  <!-- 左：AI 剧场 -->
  <div class="ai-stage" id="aiStage"></div>

  <!-- 中：主区 -->
  <div class="center">
    <div class="news-card" id="newsCard">
      <div class="tag" id="newsTag">📰 今日新闻 · 第 1 日</div>
      <div id="newsList"></div>
      <div class="hint">影响哪只股？利好还是利空？真还是假？自己判断，或用卡核实。</div>
    </div>
    <div class="section-t">📈 交易席 · 5 只股票（点选后用底部买卖卡下单）</div>
    <table class="stock-tbl"><thead><tr>
      <th>代码</th><th>名称</th><th>现价</th><th>涨跌</th><th>走势</th><th>持仓</th>
    </tr></thead><tbody id="stockBody"></tbody></table>
    <div style="margin-top:14px;text-align:center">
      <button class="btn" id="phaseBtn">▸ 继续</button>
    </div>
  </div>

  <!-- 右：候选卡 -->
  <div class="cards-zone">
    <h3 id="candTitle">本日候选 · 3 选 2</h3>
    <div class="cand-list" id="candList"></div>
    <div class="cand-cta" id="candCta"></div>
  </div>

  <!-- 底左：标签 -->
  <div class="hand-l">🎒 随身手牌<br><span id="handCount">0</span> / 6</div>
  <!-- 底：手牌坞 -->
  <div class="hand-dock" id="handDock"></div>
</div>

<!-- 模态层 -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   股票大亨 · 地下交易酒馆 — 原型（mock 数据，纯前端）
   实现：准备界面 → 盘前/发言/选牌/行动/结算 的核心日循环
   骰子为后台隐藏引擎，玩家只看涨跌幅
   ============================================================ */

const FACTIONS=[
  {id:'def',ic:'🛡️',nm:'稳健防守流',ds:'止损控仓，稳中求胜',color:'--fac-def'},
  {id:'agg',ic:'⚔️',nm:'激进进攻流',ds:'杠杆梭哈，放大盈亏',color:'--fac-agg'},
  {id:'inf',ic:'🔮',nm:'信息先知流',ds:'提前看穿消息真假',color:'--fac-inf'},
  {id:'trd',ic:'🏄',nm:'趋势跟随流',ds:'顺势而为，追涨杀跌',color:'--fac-trd'},
  {id:'evt',ic:'🎲',nm:'事件驱动流',ds:'混乱中寻找机会',color:'--fac-evt'},
  {id:'qnt',ic:'🤖',nm:'量化算法流',ds:'数据评级，理性下注',color:'--fac-qnt'},
];

// 6 个 AI 对手（不显示流派标签，靠发言/调查/复盘去猜）
// persona 仅用于喂给 DeepSeek 生成发言口吻；真实意图(_dir/_mode)仍由本地决定
const AIS=[
  {face:'🎩',name:'老K',  persona:'老练沉稳的市场庄家，话少、爱给暗示、喜欢稳坐钓鱼台'},
  {face:'🧔',name:'阿强', persona:'莽撞激进的赌徒，爱喊满仓梭哈、嗓门大、上头'},
  {face:'🔮',name:'神婆', persona:'神神叨叨的玄学派，爱用直觉、预感和玄学说话'},
  {face:'🏄',name:'浪子', persona:'追热点的短线浪人，跟风、爱蹭题材、语速快'},
  {face:'🤡',name:'小丑', persona:'爱搅局、阴阳怪气、喜欢误导别人的捣蛋鬼'},
  {face:'🤖',name:'铁算盘',persona:'冷静理性的量化派，只信数据和概率，说话像机器'},
];

  const a=[]; let v=p*(0.88+Math.random()*0.24);
  for(let i=0;i<8;i++){ a.push(+v.toFixed(2)); v*=1+(Math.random()-0.5)*0.07; }
  a.push(+p.toFixed(2)); return a;
}

function pickNews(){
  const r=Math.random();
  const count = r<0.15?0 : r<0.55?1 : r<0.85?2 : 3;
  const pool=NEWS_POOL.slice();
  const list=[];
  for(let k=0;k<count && pool.length;k++){
    const idx=(Math.random()*pool.length)|0;
    list.push({...pool[idx], real:Math.random()<0.6}); // 真:假 ≈ 6:4
    pool.splice(idx,1);
  }
  state._newsList=list;
}
function renderNews(){

  if(list.length===0){box.innerHTML='<div class="news-quiet">今日无重大消息，市场平静。</div>';return;}
  box.innerHTML=list.map(n=>{
    const tag=state._newsRevealed?`<span class="real ${n.real?'t':'f'}">${n.real?'真消息':'假消息'}</span>`:'';
    return `<div class="news-item"><span class="bull">●</span><span class="txt">${n.text}</span>${tag}</div>`;
  }).join('');
}
function renderKline(s){
  const h=s._hist||buildHist(s.price);
  const H=24;
  const cands=[];
  for(let i=1;i<h.length;i++){
    const o=h[i-1], c=h[i];
    cands.push({o,c,hi:Math.max(o,c)*1.008, lo:Math.min(o,c)*0.992});
  }
  const allLo=Math.min(...cands.map(x=>x.lo)), allHi=Math.max(...cands.map(x=>x.hi));
  const span=(allHi-allLo)||1, y=v=>H*(v-allLo)/span;
  return `<span class="kline">${cands.map(k=>{
    const up=k.c>=k.o;
    const bodyTop=H-y(Math.max(k.o,k.c)), bodyH=Math.max(1,Math.abs(y(k.c)-y(k.o)));
    const wickTop=H-y(k.hi), wickH=Math.max(1,y(k.hi)-y(k.lo));
    return `<span class="cdl ${up?'u':'d'}"><i class="wk" style="top:${wickTop}px;height:${wickH}px"></i><i class="bd" style="top:${bodyTop}px;height:${bodyH}px"></i></span>`;
  }).join('')}</span>`;
}

function enterPhase(p){

  }else if(p==='speech'){

async function runSpeech(){
  // 为每个 AI 暗定真实意图（结算/识破用，DeepSeek 不决定这些）
  AIS.forEach(a=>{
    a._dir=DIRS[(Math.random()*3)|0];
    a._str=STRENGTH[(Math.random()*3)|0];
    a._mode=MODES[(Math.random()*3)|0];
    a._inv=false; a._rev=null; a._pnl=((Math.random()*8-3)).toFixed(1);
  });
  // 本地兜底台词（DeepSeek 不可用时使用）
  const local=[
    `${pick(STOCKS).name}今天稳，我已经布局了。`,
    `怂什么？满仓干它！`,
    `我掐指一算，今日宜进不宜退…`,
    `${pick(STOCKS).name}是今天的妖股，冲！`,
    `嘿嘿，你们都会亏的。`,
    `数据显示，概率在我这边。`,
  ];
  AIS.forEach((a,i)=>a._speech=local[i]);
  // 在线生成（DeepSeek），失败则保留本地台词
  state.speaking=-1; state._bubble=null; renderAI();
  toast('🃏 牌桌上的人正在开口…（连线 DeepSeek）');
  try{
    const body={
      day:state.day,
      sentiment:'',
      news:(state._newsList||[]).map(n=>n.text),
      stocks:STOCKS.map(s=>s.name),
      agents:AIS.map(a=>({name:a.name,persona:a.persona,dir:a._dir,mode:a._mode})),
    };
    const r=await fetch('/api/ai-speeches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok && Array.isArray(d.speeches)){
      d.speeches.forEach(sp=>{const a=AIS.find(x=>x.name===sp.name); if(a&&sp.message)a._speech=String(sp.message);});
    }else{
      toast('⚠ DeepSeek 未启用，使用本地台词');
    }
  }catch(e){ toast('⚠ 连线失败，使用本地台词'); }
  // 依次冒泡
  let i=0;
  const step=()=>{
    if(i>=AIS.length){
      state.speaking=-1;state._bubble=null;renderAI();
      if(hasCurio('CUR-02')) revealOneAI();   // 内幕通讯器：每日揭示1个AI真实方向
      enterPhase('pick');return;
    }
    state.speaking=i; state._bubble={i,text:AIS[i]._speech};
    renderAI();
    i++; setTimeout(step,1500);
  };
  step();
}
function drawCandidates(){
  // 加权抽样：本流派祝福×2（流派图腾→×4），其余×0.5，信息卡×1
  const facMult=hasCurio('CUR-08')?4:2;       // 流派图腾
  const pool=[];
  INFO_CARDS.forEach(c=>pool.push({c,w:1}));
  BLESS_CARDS.forEach(c=>pool.push({c,w:c.fac===state.faction?facMult:0.5}));
  const drawN=3+(hasCurio('CUR-05')?1:0);     // 老千牌：多抽 1 张
  const out=[];
  const tmp=pool.slice();
  while(out.length<drawN && tmp.length){
    const tot=tmp.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot,idx=0;
    for(let k=0;k<tmp.length;k++){r-=tmp[k].w;if(r<=0){idx=k;break;}}
    out.push({...tmp[idx].c,_pick:false});tmp.splice(idx,1);
  }
  return out;
}

function playCard(id){
  const card=state.hand.find(c=>c.id===id&&!c._used);
  if(!card)return;
  if(card.id==='duizhao'){ // 对照新闻：核实今日全部新闻真假
    consumeInfoAp(); card._used=true;
    revealNews();
    toast((state._newsList||[]).length?'📰 已核实今日新闻真假':'📰 今日无新闻可核实');
    renderHand();return;
  }
  if(card.ty==='信息'){ state.pendingCard=card; toast('选择一个 AI 调查'); renderAI(); return; }
  // 祝福卡：直接激活
  spendAp(card.ap||1); card._used=true;
  if(card.id==='b_evt1'){ state.feeFreeToday=true; toast('✨【浑水摸鱼】今日交易免手续费'); }
  else if(card.id==='b_inf1'){ revealNews(); toast('✨【新闻预读】已得知今日新闻真假'); }
  else if(card.id==='b_agg1'){ state.levBlessToday=true; toast('✨【杠杆冲锋】今日购买力 ×1.5'); }
  else toast(`✨ 激活祝福【${card.nm}】`);
  renderHand();
}
function onAIClick(i){

  if(state.pendingCard){
    const card=state.pendingCard;

    else if(card.id==='zijin'){a._rev.str=a._str; info=`真实下注强度：${a._str}`;}
    state.pendingCard=null;

  }
}

function submitOrder(side){
  const s=STOCKS[state.selStock];
  const p=+$('#ordPrice').value, qty=+$('#ordQty').value;
  const isBuy=side==='buy', ratio=p/s.price;
  // 校验：买入不得超过购买力(现金×杠杆)；卖出须有持仓
  if(isBuy){
    const need=p*qty+calcFee(p*qty);
    if(qty<=0){toast('数量需 >0');return;}
    if(need>buyingPower()){toast(`购买力不足（可用 ${fmt(buyingPower())}）`);return;}
  }else{
    if(s.pos<=0){toast('该股无持仓，无法卖出');return;}
  }
  let prob = isBuy ? (ratio>=1.02?1:ratio>=1?0.7:ratio>=0.98?0.4:0.1)
                   : (ratio<=0.98?1:ratio<=1?0.7:ratio<=1.02?0.4:0.1);
  spendAp(1);
  closeModal();
  if(Math.random()<prob){
    if(isBuy){
      const amt=p*qty, fee=calcFee(amt);
      state.cash-=amt+fee; s.pos+=qty;
      toast(`✅ 买入 ${qty} 股 @${p.toFixed(2)}，手续费 ${fmt(fee)}`);
    }else{
      const q=Math.min(qty,s.pos), amt=p*q, fee=calcFee(amt);
      state.cash+=amt-fee; s.pos-=q;
      toast(`✅ 卖出 ${q} 股 @${p.toFixed(2)}，手续费 ${fmt(fee)}`);
    }
  }else{
    toast(`❌ 未成交（出价不够），行动点已消耗`);
  }
  renderAll();
}
function spendAp(n){state.ap=Math.max(0,state.ap-n);renderHud();if(state.ap===0)toast('行动点耗尽，可收盘结算');}

/* ---------- 结算（隐藏骰子，只显示涨跌幅） ---------- */
function revealNews(){ state._newsRevealed=true; renderNews(); }
function rollHiddenOutcomes(){
  const map=[-6,-3,1,4,8];          // 成功数 0..4 → 涨跌幅
  STOCKS.forEach(s=>{ s._succ=(Math.random()*5)|0; });   // 后台基础骰，玩家看不到
  // 真新闻影响目标股：真利好 +1 / 真利空 -1；假新闻无效（仅是噪音）
  (state._newsList||[]).forEach(n=>{
    if(!n.real || !n.dir) return;
    STOCKS.forEach(s=>{
      if(n.target===s.code || n.target==='ALL'){
        s._succ=Math.max(0,Math.min(4, s._succ + n.dir));
      }
    });
  });
  STOCKS.forEach(s=>{ s._move=map[s._succ]; });
}
function doSettle(){
  state._newsRevealed=true;            // 收盘揭晓今日新闻真假
  const map=[-6,-3,1,4,8];
  // 改命符：对 1 只持仓股的结果重算一次，取较优
  if(hasCurio('CUR-03')){
    const held=STOCKS.filter(s=>s.pos>0);
    if(held.length){
      const t=held.reduce((a,b)=>a._succ<=b._succ?a:b);  // 最差的一只
      t._succ=Math.max(t._succ,(Math.random()*5)|0); t._move=map[t._succ];
    }
  }
  let pnl=0;
  const rows=STOCKS.map(s=>{
    const before=s.price; s.price=+(s.price*(1+s._move/100)).toFixed(2);
    s.chg=s._move;
    s._hist=[...(s._hist||buildHist(before)).slice(-8), s.price];  // 收盘追加一根K线
    if(s.pos>0)pnl+=s.pos*(s.price-before);
    return `<div class="settle-row"><span>${s.name}</span>
      <span class="${s._move>=0?'up':'down'}">${s._move>=0?'+':''}${s._move}%</span></div>`;
  }).join('');
  // 今日新闻兑现回顾（真新闻→影响个股；假新闻→无效）
  const byCode=Object.fromEntries(STOCKS.map(s=>[s.code,s]));
  const newsRecap=(state._newsList||[]).map(n=>{
    const tgt=n.target==='ALL'?'大盘':(byCode[n.target]?.name||'');
    const verdict=n.real?`真·${n.dir>0?'利好':'利空'}（${tgt}）`:`假消息·无影响`;
    const cls=n.real?(n.dir>0?'up':'down'):'';
    return `<div class="settle-row" style="font-size:.8rem">
      <span style="flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.text}</span>
      <span class="${cls}" style="flex:0 0 auto;margin-left:8px">${verdict}</span></div>`;
  }).join('');
  state.cash+=pnl;
  // 黑天鹅保险：当日亏损超过带入额 15% 时，返还 60% 损失
  let insure=0;
  if(hasCurio('CUR-01') && pnl<0 && (-pnl)>0.15*state.bringIn){
    insure=Math.round(-pnl*0.6); state.cash+=insure;
  }
  // 简化 AI 排名波动
  state.rank=Math.max(1,Math.min(7, state.rank + (pnl>0?-1: (Math.random()<.5?1:0))));
  const last=state.day>=7;
  showModal(`
    <h2>🏁 第 ${state.day} 日 · 收盘结算</h2>
    ${newsRecap?`<div class="section-t" style="margin:4px 0">📰 今日新闻兑现</div>${newsRecap}`:''}
    <div class="section-t" style="margin:10px 0 4px">📈 个股涨跌（后台结算，不展示骰子）</div>
    ${rows}
    <div class="settle-row" style="border:none;margin-top:8px">
      <b>今日持仓盈亏</b><b class="${pnl>=0?'up':'down'}">${pnl>=0?'+':''}${fmt(pnl)}</b></div>
    ${insure?`<div class="settle-row" style="border:none"><span>🦢 黑天鹅保险返还</span><b class="up">+${fmt(insure)}</b></div>`:''}
    <div class="rank-badge">本局排名 ${state.rank}/7 ${state.rank<=3?'🏆 暂列撤离区':'⚠ 掉出前三'}</div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="nextDay">${last?'本局结束 · 撤离':'进入第 '+(state.day+1)+' 日 ▸'}</button>
    </div>`);
  $('#nextDay').onclick=last?doExtract:nextDay;
  renderHud();
}
function nextDay(){
  closeModal();
  state.day++;
  state.maxAp=dailyMaxAp(); state.ap=state.maxAp;   // 行动兴奋剂在此体现
  state.hand.forEach(c=>c._used=false); // 跨日保留、重置可用
  AIS.forEach(a=>{a._inv=false;a._speech=null});
  state._bubble=null;
  state.feeFreeToday=false; state.levBlessToday=false; state.firstInfoUsedToday=false;
  enterPhase('news');
}
function doExtract(){
  const ok=state.rank<=3;
  let carry=state.cash;
  // 加密钱包：撤离成功带出资金 +5%
  let bonus=0;
  if(ok && hasCurio('CUR-09')){ bonus=Math.round(state.cash*0.05); carry+=bonus; }
  state.bank=state.bank-state.bringIn+carry;
  // 奇物去留：成功全保留；失败销毁（保险箱可留 1 件）
  let curioLine;
  if(ok) curioLine=state.curios.length?'✅ 收入仓库（可复用）':'（本局未购奇物）';
  else if(hasCurio('CUR-10')) curioLine='⚠ 失败销毁，但🏦保险箱保留 1 件';
  else curioLine=state.curios.length?'❌ 全部销毁':'（本局未购奇物）';
  showModal(`
    <h2>${ok?'🏆 撤离成功（前三）':'💀 撤离失败（第4~7名）'}</h2>
    <div class="settle-row"><span>本局总资产</span><b class="cash">${fmt(state.cash)}</b></div>
    ${bonus?`<div class="settle-row"><span>🔐 加密钱包 +5%</span><b class="up">+${fmt(bonus)}</b></div>`:''}
    <div class="settle-row"><span>资金带出</span><b class="up">${fmt(carry)}</b></div>
    <div class="settle-row"><span>奇物（${state.curios.map(id=>CURIO_BY_ID[id].ic).join('')||'无'}）</span><b>${curioLine}</b></div>
    <div class="settle-row"><span>手牌</span><b>✅ 存入随身牌库（无条件保留）</b></div>
    <div class="settle-row" style="border:none"><span>银行变化</span>
      <b class="${carry-state.bringIn>=0?'up':'down'}">${carry-state.bringIn>=0?'+':''}${fmt(carry-state.bringIn)}</b></div>
    <div class="rank-badge">🏦 银行总资产 ${fmt(state.bank)}</div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="location.reload()">回到准备界面 ▸</button></div>`);
}

/* ---------- 工具 ---------- */
function pick(arr){return arr[(Math.random()*arr.length)|0];}
function showModal(html){$('#modalBox').innerHTML=html;$('#modalBg').classList.add('on');}
function closeModal(){$('#modalBg').classList.remove('on');}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);}

initPrep();
</script>
</body>
</html>
